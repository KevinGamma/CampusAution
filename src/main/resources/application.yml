server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_auction?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      # Serialize LocalDateTime as ISO-8601 strings ("2025-05-09T18:00:00"),
      # not as integer arrays ([2025,5,9,18,0,0]) — required by the frontend countdown timer.
      write-dates-as-timestamps: false

app:
  jwt:
    # HS256 key — must be ≥ 32 characters (256 bits). Change before deploying.
    secret: "campus-auction-jwt-secret-key-for-hs256-must-be-long-enough-32chars"
    expiration: 604800000   # 7 days in milliseconds

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # Maps Java enum names (ACTIVE, FINISHED …) to MySQL ENUM string values
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      # Wrap every column name in backticks so MySQL reserved words (e.g. `timestamp`)
      # never cause BadSqlGrammarException in generated SQL.
      column-format: "`%s`"
